<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Widget script</title>
<style>
  body{margin:0;padding:20px 16px;font-family:-apple-system,system-ui,sans-serif;background:#fafaf7;color:#222}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 14px;font-size:15px;line-height:1.6}
  button{font-size:20px;padding:14px 28px;border:0;border-radius:12px;background:#2f6fd6;color:#fff}
  button:disabled{background:#999}
  #msg{margin:12px 0;font-size:16px;font-weight:600;min-height:1.4em}
  .ok{color:#1d7a3a}.ng{color:#b3261e}
  textarea{width:100%;box-sizing:border-box;height:40vh;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid #ccc;border-radius:8px;padding:8px}
</style>
</head>
<body>
<h1>ウィジェットのスクリプト</h1>
<p>ボタンを押すと全文がコピーされます。そのあと Scriptable の新しいスクリプトに貼ってください。</p>
<button id="copy" disabled>読み込み中…</button>
<div id="msg"></div>
<textarea id="src" readonly></textarea>
<script>
(function () {
  var btn = document.getElementById("copy"), src = document.getElementById("src"), msg = document.getElementById("msg");
  function say(t, cls) { msg.textContent = t; msg.className = cls || ""; }
  fetch("widget.js?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) { src.value = t; btn.disabled = false; btn.textContent = "コピー"; })
    .catch(function () { btn.textContent = "読み込めませんでした"; say("ページを開き直してください。", "ng"); });
  function fallback() {
    src.removeAttribute("readonly"); src.focus(); src.setSelectionRange(0, src.value.length);
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    src.setAttribute("readonly", ""); src.blur();
    return ok;
  }
  btn.addEventListener("click", function () {
    var lines = src.value.split("\n").length;
    var done = function () { say("コピーしました（" + lines + "行）。Scriptable に貼ってください。", "ok"); };
    var fail = function () { say("コピーできませんでした。下の枠を長押し →「すべてを選択」→「コピー」でも取れます。", "ng"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(src.value).then(done, function () { fallback() ? done() : fail(); });
    } else { fallback() ? done() : fail(); }
  });
})();
</script>
</body>
</html>
